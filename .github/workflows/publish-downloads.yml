name: Publish verified Zunavo Android test build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Verify completed playback test
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: zulaikahn/orbit
        run: |
          test "$(gh api repos/zulaikahn/orbit/actions/runs/41502227185 --jq .conclusion)" = success
      - name: Retrieve tested Android build
        uses: actions/download-artifact@v4
        with:
          name: Zunavo-Android-0.2.1-experimental
          path: downloads/android
          run-id: 41502227185
          github-token: ${{ github.token }}
      - name: Publish experimental Android download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: zulaikahn/orbit
        run: |
          set -eu
          test -s downloads/android/app-debug.apk
          mv downloads/android/app-debug.apk downloads/android/Zunavo-Android-0.2.1-experimental.apk
          sha256sum downloads/android/Zunavo-Android-0.2.1-experimental.apk > downloads/android/SHA256SUMS.txt
          gh release create android-v0.2.1 --target main --prerelease --title 'Zunavo Android 0.2.1 — experimental native torrent player' --notes 'Experimental Android-only native torrent player with loading retries, fullscreen controls, a visible Torrentio connection card, and a storage check based on free phone space. APK compilation, file selection tests, and playback plus seeking of an original generated video passed on an Android 15 emulator in run 41502227185. Physical Android phone playback and third-party provider compatibility remain unverified. This does not change the public website or iPhone support. Debug-signed testing build; an existing preview may have a different signing key. Temporary video cache is cleared when leaving the player. Use content you have permission to access.'
          gh release upload android-v0.2.1 downloads/android/Zunavo-Android-0.2.1-experimental.apk downloads/android/SHA256SUMS.txt
