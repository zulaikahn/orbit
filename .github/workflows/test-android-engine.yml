name: Test Zunavo native Android playback
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android project
        run: |
          unzip -q Zunavo-Android-Engine-Source.zip -d native
          cd native
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify-assets
          node --check www/native-torrent.js
          npx cap sync android
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
          chmod +x android/gradlew
      - name: Compile APK and run selection and seeking-boundary tests
        working-directory: native/android
        run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Zunavo-Android-0.2.0-experimental
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare original video and local torrent seeder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=320x180:rate=15 -f lavfi -i sine=frequency=440 -t 35 -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart fixture.mp4
          mkdir fixture-tools
          cd fixture-tools
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund webtorrent@3.0.21
          cp ../native/scripts/torrent-fixture.mjs .
          nohup node torrent-fixture.mjs ../fixture.mp4 > fixture.log 2>&1 &
          for i in $(seq 1 30); do test -s fixture-hash.txt && break; sleep 1; done
          test -s fixture-hash.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual torrent playback and seeking in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd native/android && ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.hash=$(cat ../../fixture-tools/fixture-hash.txt) --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Zunavo-native-playback-test-results
          path: |
            native/android/app/build/reports
            native/android/app/build/outputs/androidTest-results
            fixture-tools/fixture.log
